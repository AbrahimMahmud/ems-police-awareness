[project]
name = "ems-police-awareness"
version = "0.1.0"
description = "Public attention to police violence and NYC EMS mental-health dispatch share: a pre-registered stacked event study with a sealed confirmation sample"
requires-python = ">=3.11,<3.12"
# The five estimation libraries are pinned to the versions the analysis ran on (pip freeze in
# the analysis container, 2026-09-20). Never re-lock or bump them without asking: 03_main_model
# and 03b read pyfixest private attributes, and the null-calibration certificates were issued
# under these exact versions.
dependencies = [
  "pandas==3.0.5",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "statsmodels==0.15.0",
  "pyfixest==0.60.0",
  "pyarrow==25.0.1",
  "duckdb==1.5.5",
  "matplotlib==3.11.2",
  "openpyxl>=3.1.0",
  "requests==2.33.1",
  "pyyaml==6.0.1",
  "tabulate==0.10.0",
  "tqdm==4.70.1",
  "pytrends>=4.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
